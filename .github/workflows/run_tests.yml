name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-environments:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false
      - id: get-envs
        run: |
          ENVS_JSON=$(NO_COLOR=1 uvx hatch env show --json | jq -c 'to_entries
            | map(
              select(.key | startswith("hatch-test"))
              | { name: .key, python: .value.python }
            )')
          echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT

  test:
    needs:
      - get-environments
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-environments.outputs.envs) }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip wheel
      - name: Install Python package and dependencies
        run: pip install .[test] coverage coveralls
      - name: Run tests
        run: coverage run --source=get_version -m pytest --verbose --color=yes
      - name: Coveralls
        uses: coverallsapp/github-action@v2
  check:
    if: always()
    needs:
      - get-environments
      - test
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
