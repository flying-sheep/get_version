[project]
name = 'get_version'
authors = [{ name = 'Philipp Angerer', email = 'phil.angerer@gmail.com' }]
urls.Homepage = 'https://github.com/flying-sheep/get_version'
classifiers = [
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)',
]
readme = 'README.rst'
license = { file = 'LICENSE' } # 'GPL-3.0-or-later'
requires-python = '>=3.9'
dependencies = [
    'dunamai>=1.19.0',  # Version parsing
]
dynamic = ['version', 'description']

[project.optional-dependencies]
test = [
    'pytest>=6.2.5',
    'pytest-mypy',
    'pygments',  # for README highlighting check
]

[tool.hatch.envs.hatch-test]
features = ['test']

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'UP', 'TC', 'ANN', 'RUF', 'PT']
allowed-confusables = ['’', '×']
isort.lines-after-imports = 2
isort.known-first-party = ["get_version"]
isort.required-imports = ["from __future__ import annotations"]
flake8-type-checking.strict = true
flake8-type-checking.exempt-modules = []

[tool.pytest]
addopts = ['-p', 'get_version.testing']
filterwarnings = ['error']
strict = true

[tool.coverage]
run.source_pkgs = ["get_version"]
paths.source = ["./src", "**/site-packages"]
report.exclude_also = [
    'if TYPE_CHECKING:',
]

[build-system]
requires = ['flit-core>=2,<4', 'dunamai']
build-backend = 'flit_core.buildapi'
